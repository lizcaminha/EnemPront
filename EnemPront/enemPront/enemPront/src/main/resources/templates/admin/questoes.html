<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Enem Pront - Questões (ADM)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&display=swap">
  <link rel="stylesheet" href="styles.css" th:href="@{/styles.css}">
</head>
<body>

<header id="hd">
  <a href="index.html" th:href="@{/}" class="logo"><span>Enem <b>Pront</b></span></a>
  <nav>
    <a href="#" th:href="@{/admin}">🛠️ Painel</a>
    <a href="#" th:href="@{/admin/questoes}" class="cur">📚 Questões</a>
    <a href="#" th:href="@{/admin/usuarios}">👥 Usuários</a>
    <a href="#" th:href="@{/admin/catalogos}">🗂️ Catálogos</a>
    <a href="#" th:href="@{/}">🏠 Site</a>
  </nav>
  <div class="auth" th:unless="${usuarioLogado != null}">
    <a href="login.html" th:href="@{/login}" class="btn-o">Entrar</a>
    <a href="cadastro.html" th:href="@{/cadastro}" class="btn-f">Cadastrar</a>
  </div>
  <div class="auth" th:if="${usuarioLogado != null and not usuarioLogado.admin()}">
    <a href="perfil.html" th:href="@{/perfil}" class="chip"><span class="av"></span><span th:text="${usuarioLogado.nome()}">Aluno</span></a>
    <form th:action="@{/logout}" method="post"><button type="submit" class="out" aria-label="Sair">⇤</button></form>
  </div>
  <div class="auth" th:if="${usuarioLogado != null and usuarioLogado.admin()}">
    <a href="#" th:href="@{/admin}" class="chip adm"><span class="av adm">👤</span>ADM</a>
    <form th:action="@{/logout}" method="post"><button type="submit" class="out" aria-label="Sair">⇤</button></form>
  </div>
</header>

<main class="view">
  <div class="wrap">
    <div class="flash" th:if="${erro != null}" th:text="${erro}"></div>
    <div class="flash ok" th:if="${sucesso != null}" th:text="${sucesso}"></div>
    <h2 class="pg">📚 Questões e gabaritos</h2>
    <div class="panel" style="border-radius:18px">
      <form class="barra" th:action="@{/admin/questoes}" method="get">
        <input class="sel" type="search" name="q" th:value="${filtro.q}" maxlength="100" placeholder="🔍 Buscar no enunciado" style="text-align:left">
        <a class="btn-f" href="#" th:href="@{/admin/questoes/nova}">➕ Nova questão</a>
      </form>
      <p class="vazio" th:if="${#lists.isEmpty(pagina.itens())}">Nenhuma questão encontrada.</p>
      <div class="tbl-wrap" th:unless="${#lists.isEmpty(pagina.itens())}">
        <table class="tbl">
          <thead><tr><th>#</th><th>Edição</th><th>Enunciado</th><th>Gabarito</th><th>Tópicos</th><th>Ações</th></tr></thead>
          <tbody>
            <tr th:each="r : ${pagina.itens()}">
              <td th:text="${r.id()}">1</td>
              <td th:text="${r.edicao()}">ENEM 2009 (R)</td>
              <td th:text="${r.enunciado()}">Enunciado</td>
              <td><b th:text="${r.gabarito()}">B</b></td>
              <td th:text="${r.topicos()}">Termodinâmica</td>
              <td>
                <div class="acoes">
                  <a class="btn-s" href="#" th:href="@{|/admin/questoes/${r.id()}/editar|}">Editar</a>
                  <form th:action="@{|/admin/questoes/${r.id()}/excluir|}" method="post" data-confirm="Excluir esta questão?">
                    <button type="submit" class="btn-s danger">Excluir</button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="pager" th:if="${pagina.totalPaginas() gt 1}">
        <a th:if="${pagina.numero() gt 0}" th:href="@{/admin/questoes(q=${filtro.q},pagina=${pagina.numero() - 1})}">← Anterior</a>
        <span th:text="|Página ${pagina.numero() + 1} de ${pagina.totalPaginas()}|">Página 1 de 3</span>
        <a th:if="${pagina.numero() + 1 lt pagina.totalPaginas()}" th:href="@{/admin/questoes(q=${filtro.q},pagina=${pagina.numero() + 1})}">Próxima →</a>
      </div>
    </div>
  </div>
</main>
<script th:src="@{/app.js}" defer></script>
</body>
</html>
