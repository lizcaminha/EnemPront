<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Enem Pront - Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&display=swap">
  <link rel="stylesheet" href="styles.css" th:href="@{/styles.css}">
</head>
<body>

<header id="hd">
  <a href="index.html" th:href="@{/}" class="logo"><span>Enem <b>Pront</b></span></a>
  <nav>
    <a href="index.html" th:href="@{/}">🏠 Início</a>
    <a href="questoes.html" th:href="@{/questoes}">📚 Questões</a>
    <a href="simulado.html" th:href="@{/simulado}">📝 Simulado</a>
    <a href="desempenho.html" th:href="@{/desempenho}">📊 Desempenho</a>
  </nav>
  <div class="auth" th:unless="${usuarioLogado != null}">
    <a href="login.html" th:href="@{/login}" class="btn-o">Entrar</a>
    <a href="cadastro.html" th:href="@{/cadastro}" class="btn-f">Cadastrar</a>
  </div>
  <div class="auth" th:if="${usuarioLogado != null and not usuarioLogado.admin()}">
    <a href="perfil.html" th:href="@{/perfil}" class="chip"><span class="av"></span><span th:text="${usuarioLogado.nome()}">Aluno</span></a>
    <form th:action="@{/logout}" method="post"><button type="submit" class="out" aria-label="Sair">⇤</button></form>
  </div>
  <div class="auth" th:if="${usuarioLogado != null and usuarioLogado.admin()}">
    <a href="#" th:href="@{/admin}" class="chip adm"><span class="av adm">👤</span>ADM</a>
    <form th:action="@{/logout}" method="post"><button type="submit" class="out" aria-label="Sair">⇤</button></form>
  </div>
</header>

<main class="view">
  <form class="box sm" th:action="@{/login}" method="post" novalidate>
    <a href="index.html" th:href="@{/}" class="logo"><span>Enem <b>Pront</b></span></a>
    <h2>Bem-vindo de volta</h2>
    <p class="t">Entre na sua conta para continuar estudando</p>
    <div class="flash" th:if="${param.error}">Email ou senha inválidos</div>
    <div class="flash" th:if="${param.bloqueado}">Muitas tentativas. Aguarde alguns minutos e tente novamente</div>
    <div class="flash ok" th:if="${sucesso != null}" th:text="${sucesso}"></div>
    <div class="f" style="margin-bottom:22px">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="username" maxlength="50">
    </div>
    <div class="f" style="margin-bottom:46px">
      <label for="pass">Senha</label>
      <input type="password" id="pass" name="senha" placeholder="Sua senha" autocomplete="current-password" maxlength="64">
      <button type="button" class="eye" aria-label="Mostrar senha">👁️</button>
    </div>
    <button class="go" type="submit">🚀 Entrar</button>
    <p class="alt">Não tem uma conta? <a href="cadastro.html" th:href="@{/cadastro}">Cadastrar-se grátis</a></p>
  </form>
</main>

<a href="index.html" th:href="@{/}" class="back" aria-label="Voltar">←</a>

<script th:src="@{/app.js}" defer></script>
</body>
</html>
